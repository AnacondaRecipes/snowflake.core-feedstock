{% set name = "snowflake.core" %}
{% set version = "1.14.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('.', '_') }}-{{ version }}.tar.gz
  sha256: 7301f38fa9b2f10009423a11637872da305a5e6ee8d2a70dc1cf9ab1973e56a6

build:
  # allows SF to rebuild the package as needed without incurring a
  # higher build number than the package we release
  number: 100
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<311]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - certifi >=2026.10.19
    - packaging
    - pydantic >=2
    - python-dateutil >=2.8.2
    - requests
    - snowflake-connector-python
    - pyyaml
    - typing_extensions
    - urllib3 >=2
  run_constrained:
    - snowflake-snowpark-python >=1.5.0,<2.0.0
    # Upstream defines this constraint for the optional 'universal-core' extra,
    # which requires Snowflake Connector 5.x.
    # Keep it disabled to avoid enforcing this optional requirement
    # on standard installations using older connector versions.
    # - snowflake-connector-python >=5.0.0a0,!=5.0.0
    
    

test:
  imports:
    - snowflake.core
  source_files:
    - tests
  commands:
    - pip check
    # 1. do not test tests/integ because
    #    we do not have CONNECTION_PARAMETERS set
    # 2. tests/unit/test_common.py rely on paths relative to the test source file location
    #    PROJECT_SRC = Path(__file__).parent.parent.parent / "src" / "snowflake" / "core"
    # unset conda-injected SSL vars so ca_certs tests expect None (Windows only)
    - set SSL_CERT_FILE=&  # [win]
    - set REQUESTS_CA_BUNDLE=&  # [win]
    - set CURL_CA_BUNDLE=& # [win]
    - pytest tests/unit -m "not snowpark" --ignore=tests/unit/test_common.py
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/snowflake.core
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Snowflake Python API for Resource Management
  description: Snowflake Python API for Resource Management
  doc_url: https://docs.snowflake.com/developer-guide/snowflake-python-api/snowflake-python-overview
  dev_url: https://pypi.org/project/snowflake.core

extra:
  recipe-maintainers:
    - lorepirri
